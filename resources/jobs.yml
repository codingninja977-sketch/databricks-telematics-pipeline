resources:
  jobs:

    setup_truck_details:
      name: ${bundle.target}-setup-truck-details

      tasks:
        - task_key: seed_truck_details

          spark_python_task:
            python_file: ../src/seed_truck_details.py
            parameters:
              - ${var.schema_name}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"


    generate_gps_events:
      name: ${bundle.target}-generate-gps-events

      tasks:
        - task_key: generate_gps

          spark_python_task:
            python_file: ../src/generate_gps.py
            parameters:
              - ${var.schema_name}
              - "180"

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
    
    bronze_ingestion:
      name: ${bundle.target}-bronze-ingestion

      tasks:
        - task_key: bronze_ingest

          spark_python_task:
            python_file: ../src/bronze_ingest.py
            parameters:
              - ${var.schema_name}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

    silver_ingestion:
      name: ${bundle.target}-silver-ingestion

      tasks:
        - task_key: silver_ingest

          spark_python_task:
            python_file: ../src/silver_ingest.py
            parameters:
              - ${var.schema_name}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

    gold_aggregation:
      name: ${bundle.target}-gold-aggregation

      tasks:
        - task_key: gold_aggregate

          spark_python_task:
            python_file: ../src/gold_aggregation.py
            parameters:
              - ${var.schema_name}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
    
    telematics_pipeline:
      name: ${bundle.target}-telematics-pipeline

      tasks:

        - task_key: generate_gps

          spark_python_task:
            python_file: ../src/generate_gps.py
            parameters:
              - ${var.schema_name}
              - "180"

          environment_key: default


        - task_key: bronze_ingest

          depends_on:
            - task_key: generate_gps

          spark_python_task:
            python_file: ../src/bronze_ingest.py
            parameters:
              - ${var.schema_name}

          environment_key: default


        - task_key: silver_ingest

          depends_on:
            - task_key: bronze_ingest

          spark_python_task:
            python_file: ../src/silver_ingest.py
            parameters:
              - ${var.schema_name}

          environment_key: default


        - task_key: gold_aggregate

          depends_on:
            - task_key: silver_ingest

          spark_python_task:
            python_file: ../src/gold_aggregation.py
            parameters:
              - ${var.schema_name}

          environment_key: default


      environments:
        - environment_key: default

          spec:
            environment_version: "2"